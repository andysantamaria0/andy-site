name: Application Desk regression checks
on:
  pull_request:
    paths: ['lib/applications/**', 'scripts/applications/**', 'app/api/applications/**', 'app/applications/**', 'tests/applications/**', 'package*.json']
  push:
    branches: [main, codex/pip-private-watch]
    paths: ['lib/applications/**', 'scripts/applications/**', 'app/api/applications/**', 'app/applications/**', 'tests/applications/**', 'package*.json']
jobs:
  applications:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: google-chrome --version || npx playwright install --with-deps chrome
      - run: node --test tests/applications/core.test.mjs tests/applications/workflow.test.mjs tests/applications/knit.test.mjs
      - run: node tests/applications/engine-browser.mjs
      # All employer requests in these tests are intercepted. Production credentials are unnecessary.
